<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Orbital Settings</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <header class="titlebar"><span class="spacer"></span></header>

  <main>
    <section class="hero">
      <img class="app-icon" src="../../assets/icon-256.png" alt="">
      <h1>Orbital</h1>
      <p id="status" class="status"><span class="dot"></span><span id="status-text">…</span></p>
      <button id="grant" class="btn primary" hidden>Allow Accessibility Access…</button>
    </section>

    <h2 class="group-title">Picker</h2>
    <div class="group">
      <div class="row">
        <div class="row-text"><div>Drag trigger</div><div class="row-sub">Hold a key while dragging a file to open the picker</div></div>
        <input type="checkbox" id="triggerEnabled" class="switch">
      </div>
      <div class="row">
        <div class="row-text"><div>Trigger key</div></div>
        <select id="modifier" class="popup">
          <option value="shift">⇧ Shift</option>
          <option value="alt">⌥ Option</option>
          <option value="ctrl">⌃ Control</option>
        </select>
      </div>
      <div class="row">
        <div class="row-text"><div>Keyboard shortcut</div><div class="row-sub">Opens the picker for files selected in Finder</div></div>
        <kbd id="shortcut"></kbd>
      </div>
    </div>

    <h2 class="group-title">Output</h2>
    <div class="group">
      <div class="row">
        <div class="row-text"><div>Save converted files</div><div class="row-sub" id="outdir"></div></div>
        <select id="output" class="popup">
          <option value="same">Next to original</option>
          <option value="folder">In a folder…</option>
        </select>
      </div>
    </div>

    <h2 class="group-title">General</h2>
    <div class="group">
      <div class="row">
        <div class="row-text"><div>Open at login</div></div>
        <input type="checkbox" id="openAtLogin" class="switch">
      </div>
    </div>

    <h2 class="group-title">Recent</h2>
    <div class="group" id="jobs">
      <div class="row empty"><div class="row-sub">Nothing yet. Your conversions will appear here.</div></div>
    </div>

    <footer id="footer" class="footer"></footer>
  </main>

  <div id="dropveil" class="dropveil"><div>Drop to open the picker</div></div>
  <script src="icons.js"></script>
  <script src="home.js"></script>
</body>
</html>
